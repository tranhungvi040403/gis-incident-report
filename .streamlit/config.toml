[theme]
# Màu chủ đạo (Nút bấm, thanh trượt, icon) - Xanh biển đậm chuyên nghiệp
primaryColor = "#005b96"

# Màu nền chính của trang web (Xám nhạt hơi ngả xanh để làm nổi bật bản đồ)
backgroundColor = "#f4f7f6"

# Màu nền phụ (Thanh sidebar, khung chứa form)
secondaryBackgroundColor = "#ffffff"

# Màu chữ chính
textColor = "#333333"

# Font chữ hiện đại, bo tròn nhẹ
font = "sans serif"

[client]
showSidebarNavigation = false
